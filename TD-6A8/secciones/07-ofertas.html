<!-- ======================= ALUMNO 7: OFERTAS ======================= -->
<section class="seccion a7-seccion" id="ofertas">
  <div class="contenedor">
    <p class="eyebrow">Oferta relámpago</p>
    <h2 class="titulo-seccion">Ofertas de la semana</h2>
    <p class="subtitulo-seccion">Precios especiales por tiempo limitado. ¡Corre que se acaban!</p>

    <!-- CUENTA REGRESIVA: cambia data-fin por la fecha y hora en que termina tu oferta -->
    <div class="a7-contador" data-fin="2026-12-31T23:59:59-05:00">
      <div><span id="a7-dias">00</span><small>Días</small></div>
      <div><span id="a7-horas">00</span><small>Horas</small></div>
      <div><span id="a7-min">00</span><small>Min</small></div>
      <div><span id="a7-seg">00</span><small>Seg</small></div>
    </div>

    <!--
      CÓMO EDITAR UNA OFERTA:
        data-antes  = precio normal (ej: 249.90)
        data-precio = precio con descuento (ej: 149.90) -> debe ser MENOR que data-antes
      El porcentaje (-40%) y los precios visibles los calcula el JavaScript solo.
    -->
    <div class="grid-productos a7-grid">
      <article class="producto" data-nombre="Casaca Puffer" data-antes="249.90" data-precio="149.90">

        <div class="producto-info">

          <div class="a7-precios">

        <div class="producto-info">
